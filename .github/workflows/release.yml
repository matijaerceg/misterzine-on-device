name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build the device binary
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          M=github.com/matijaerceg/misterzine-on-device/internal/buildinfo
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X $M.Version=$TAG -X $M.Commit=$SHA -X $M.Date=$DATE" \
            -o dist/misterzine ./cmd/misterzine
          file dist/misterzine | tee /dev/stderr | grep -q "ELF 32-bit LSB executable, ARM" || { echo "not a static ARM binary"; exit 1; }
          file dist/misterzine | grep -q "statically linked" || { echo "not statically linked"; exit 1; }
      - name: Build the downloader database
        run: |
          python3 tools/make-db.py "${GITHUB_REF_NAME}" dist/misterzine dist/misterzine.json.zip
          cp deploy/Scripts/misterzine.sh dist/misterzine.sh
          cp deploy/downloader_misterzine.ini dist/downloader_misterzine.ini
          (cd dist && sha256sum misterzine misterzine.sh downloader_misterzine.ini misterzine.json.zip > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/misterzine
            dist/misterzine.sh
            dist/downloader_misterzine.ini
            dist/misterzine.json.zip
            dist/SHA256SUMS
          generate_release_notes: true

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Every database URL must serve the bytes the database hashes
        run: |
          sleep 30
          curl -sfL -o db.zip "https://github.com/matijaerceg/misterzine-on-device/releases/download/${GITHUB_REF_NAME}/misterzine.json.zip"
          python3 - <<'EOF'
          import hashlib, json, sys, urllib.request, zipfile
          with zipfile.ZipFile("db.zip") as z:
              db = json.loads(z.read("misterzine.json"))
          bad = 0
          for path, e in db["files"].items():
              data = urllib.request.urlopen(e["url"], timeout=60).read()
              h = hashlib.md5(data).hexdigest()
              ok = h == e["hash"] and len(data) == e["size"]
              print(("ok  " if ok else "BAD ") + path + " " + e["url"])
              bad += 0 if ok else 1
          sys.exit(1 if bad else 0)
          EOF
